<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What-If Scientific Simulator</title>
    <style>
        /* Basic clean kid-friendly styling styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121420;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
        }
        .sidebar {
            width: 300px;
            background: #1a1d36;
            padding: 20px;
            border-radius: 12px;
        }
        .main-content {
            flex: 1;
            background: #1a1d36;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .status-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .green-dot {
            width: 12px;
            height: 12px;
            background-color: #00ff66;
            border-radius: 50%;
            display: inline-block;
        }
        .input-box-container {
            display: flex;
            gap: 10px;
            position: relative;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #3b4272;
            background: #0f111a;
            color: white;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: #4d61fc;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button.shuffle-btn {
            background: #fca311;
        }
        .log-item {
            background: #24294d;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .big-display {
            background: #0f111a;
            padding: 25px;
            border-radius: 8px;
            min-height: 200px;
            font-size: 18px;
            line-height: 1.6;
            border-left: 5px solid #4d61fc;
        }
        .profile-section input {
            width: 90%;
            margin-bottom: 10px;
            padding: 8px;
            background: #0f111a;
            color: white;
            border: 1px solid #3b4272;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="status-container">
            <span class="green-dot"></span>
            <span id="user-status-text">hi - Online</span>
        </div>

        <h3>Your Character</h3>
        <div class="profile-section">
            <label>Name:</label>
            <input type="text" id="username" placeholder="Enter name...">
            <label>Outfit/Style:</label>
            <input type="text" id="outfitModule" placeholder="e.g., Spacesuit, Hoodie...">
            <button onclick="saveProfile()">Save Character</button>
        </div>

        <hr style="border: 1px solid #3b4272; margin: 20px 0;">

        <h3>Temporal Log Index</h3>
        <div id="log-index-container"></div>
    </div>

    <div class="main-content">
        <div style="text-align: center;">
            <h1 style="margin: 0;">What If?</h1>
            </div>

        <div class="input-box-container">
            <button class="shuffle-btn" onclick="triggerShuffle()">🎲 Shuffle</button>
            <input type="text" id="prompt-input" placeholder="Ask a science question... e.g., What if the moon vanished?">
            <button onclick="sendSimulation()">Simulate</button>
        </div>

        <h3>Simulation Outcome</h3>
        <div class="big-display" id="main-result-screen">
            The scientific simulation results will render here inside the primary monitor view...
        </div>
    </div>

    <script>
        // Array of fun kid-friendly science questions for the shuffle pool
        const randomQuestions = [
            "the world was flat",
            "the moon vanished tomorrow",
            "humans could fly like birds",
            "gravity was twice as strong",
            "the oceans turned into fresh water",
            "dosaurs never went extinct",
            "it rained candy instead of water"
        ];

        // Temporal history local cache array array
        let simulationHistory = [];

        // 💾 LOAD USER PROFILE AND CACHE DATA IMMEDIATELY ON LOAD
        window.onload = function() {
            if (localStorage.getItem('username')) {
                document.getElementById('username').value = localStorage.getItem('username');
                document.getElementById('user-status-text').innerText = localStorage.getItem('username') + " - Online";
            }
            if (localStorage.getItem('outfitModule')) {
                document.getElementById('outfitModule').value = localStorage.getItem('outfitModule');
            }
        };

        function saveProfile() {
            const user = document.getElementById('username').value || "hi";
            const outfit = document.getElementById('outfitModule').value || "Default Attire";
            
            localStorage.setItem('username', user);
            localStorage.setItem('outfitModule', outfit);
            
            document.getElementById('user-status-text').innerText = user + " - Online";
            alert("Character setup saved into system memories!");
        }

        // 🎲 Random Question Shuffle Engine Handler
        function triggerShuffle() {
            const randomIndex = Math.floor(Math.random() * randomQuestions.length);
            document.getElementById('prompt-input').value = randomQuestions[randomIndex];
        }

        async function sendSimulation() {
            const prompt = document.getElementById('prompt-input').value;
            const username = document.getElementById('username').value || "hi";
            const outfitModule = document.getElementById('outfitModule').value || "Standard clothes";
            const screen = document.getElementById('main-result-screen');

            if (!prompt) return alert("Please type or shuffle a question first!");

            screen.innerText = "Analyzing cosmic variables... Please stand by...";

            try {
                const response = await fetch('/api/simulate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: prompt,
                        profile: { username, outfitModule }
                    })
                });

                const data = await response.json();
                const resultText = data.simulationResult;

                // Render result strictly into the main giant frame layout container
                screen.innerText = resultText;

                // Push onto internal list timeline tracker arrays safely
                const historyItem = { topic: `What if ${prompt}`, answer: resultText };
                simulationHistory.push(historyItem);
                
                renderLogIndex();

            } catch (err) {
                screen.innerText = "[ERROR] Could not gather stream data connection: " + err.message;
            }
        }

        // Draw the log list without showing answers underneath the topics
        function renderLogIndex() {
            const container = document.getElementById('log-index-container');
            container.innerHTML = "";

            simulationHistory.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'log-item';
                div.innerText = item.topic;
                
                // 🛑 Click interaction targets and commands text straight onto the primary main view display
                div.onclick = function() {
                    document.getElementById('main-result-screen').innerText = item.answer;
                };

                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
